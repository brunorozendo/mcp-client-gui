plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.javafx)
    alias(libs.plugins.shadow)
    alias(libs.plugins.jlink)
}

group = 'com.brunorozendo'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    }
}

application {
    mainClass = 'com.brunorozendo.mcpclientgui.McpClientGuiApp'
    mainModule = 'com.brunorozendo.mcpclientgui'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.web,javafx.graphics,org.xerial.sqlitejdbc', '--sun-misc-unsafe-memory-access=allow']
}

javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.web' , 'javafx.graphics']
}

// Define the JavaFX platform
def currentOS = org.gradle.internal.os.OperatingSystem.current()
def platform
if (currentOS.isWindows()) {
    platform = 'win'
} else if (currentOS.isLinux()) {
    platform = 'linux'
} else if (currentOS.isMacOsX()) {
    platform = 'mac'
    if (System.getProperty("os.arch") == "aarch64") {
        platform = 'mac-aarch64'
    }
}

dependencies {
    // MCP SDK
    implementation libs.mcp.core
    implementation libs.mcp.json.jackson2
    constraints {
        // mcp-core 2.2.0 declares reactor-core 3.9.0-RC1, a pre-release; pin the latest stable line.
        implementation(libs.reactor.core) {
            because 'mcp-core 2.2.0 requests a release candidate; every reactor API it uses exists in 3.8.8'
        }
    }

    // JSON Processing
    implementation libs.jackson.databind
    implementation libs.jackson.annotations
    implementation libs.jackson.core

    // JavaFX Controls
    implementation libs.controlsfx

    // Logging - SLF4J API and Logback Classic Implementation
    implementation libs.slf4j.api
    implementation libs.logback.classic
    implementation libs.logback.core

    // SQLite for persistence
    implementation libs.sqlite.jdbc

    // Markdown processing
    implementation libs.commonmark

    // Testing
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.platform.launcher
    testImplementation libs.testfx.core
    testImplementation libs.testfx.junit5
    
    // Add platform-specific JavaFX dependencies for the fat JAR
    implementation variantOf(libs.javafx.base) { classifier(platform) }
    implementation variantOf(libs.javafx.controls) { classifier(platform) }
    implementation variantOf(libs.javafx.fxml) { classifier(platform) }
    implementation variantOf(libs.javafx.graphics) { classifier(platform) }
    implementation variantOf(libs.javafx.web) { classifier(platform) }
}

test {
    useJUnitPlatform()
}

run {
    jvmArgs = ['--enable-native-access=javafx.web,javafx.graphics,org.xerial.sqlitejdbc', '--sun-misc-unsafe-memory-access=allow']
}

// Configure Shadow JAR
shadowJar {
    archiveBaseName = 'mcp-client-gui'
    archiveClassifier = 'all'
    archiveVersion = version

    // Handle duplicate files
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Merge service files. Shadow 9 applies the duplicates strategy before the
    // transformers run, so service descriptors must be allowed through to the
    // ServiceFileTransformer, otherwise they would not be merged.
    mergeServiceFiles()
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    manifest {
        attributes(
            'Add-Opens': 'java.base/java.lang=ALL-UNNAMED',
            'Add-Exports': 'java.base/sun.nio.ch=ALL-UNNAMED',
            'JVM-Args': '--enable-native-access=javafx.web,javafx.graphics,org.xerial.sqlitejdbc --sun-misc-unsafe-memory-access=allow',
            'Main-Class': 'com.brunorozendo.mcpclientgui.McpClientGuiLauncher',
            'Multi-Release': 'true'
        )
    }

    // Exclude module-info.class files to avoid conflicts
    exclude 'module-info.class'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Create a distribution task that builds the shadow JAR
tasks.register('dist') {
    dependsOn shadowJar
    doLast {
        println "Fat JAR created at: ${shadowJar.archiveFile.get().asFile.absolutePath}"
    }
}

// Configure jlink for creating a custom runtime image
jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    enableCds()
    // The merged module requires JavaFX modules (see mergedModule below); make their jars
    // visible when the plugin compiles the merged module-info.
    addExtraDependencies('javafx')
    launcher {
        // App-level CDS: the JVM writes the archive on first exit and reuses it on later starts.
        // {{BIN_DIR}} is expanded by the jlink plugin for the script and jpackage launchers.
        // -Xlog:cds=off hides JDK 25's start-up notes about module options differing from dump time.
        jvmArgs = ['--enable-native-access=javafx.web,javafx.graphics,org.xerial.sqlitejdbc', '--sun-misc-unsafe-memory-access=allow',
                   '-XX:+AutoCreateSharedArchive', '-XX:SharedArchiveFile={{BIN_DIR}}/mcp-client-gui.jsa', '-Xlog:cds=off']
        name = 'mcp-client-gui'
        mainClass = 'com.brunorozendo.mcpclientgui.McpClientGuiApp'
    }
    
    // Handle automatic modules by merging them into a custom runtime
    mergedModule {
        requires 'java.desktop'
        requires 'java.logging'
        requires 'java.sql'
        requires 'java.naming'
        requires 'java.management'
        requires 'java.security.jgss'
        requires 'java.instrument'
        // Modules the merged jars (MCP SDK, json-schema-validator, ControlsFX, ...) link against;
        // without them the merged module cannot read Jackson, SLF4J, java.net.http or JavaFX at runtime.
        // List taken from `./gradlew suggestMergedModuleInfo`.
        requires 'java.net.http'
        requires 'jdk.unsupported'
        requires 'com.fasterxml.jackson.annotation'
        requires 'com.fasterxml.jackson.core'
        requires 'com.fasterxml.jackson.databind'
        requires 'org.slf4j'
        requires 'javafx.base'
        requires 'javafx.graphics'
        requires 'javafx.controls'
        requires 'javafx.media'
        
        // Force merge all automatic modules
        forceMerge 'slf4j.api'
        forceMerge 'logback.classic'
        forceMerge 'logback.core'
        forceMerge 'commonmark'
        forceMerge 'controlsfx'
        forceMerge 'jackson.annotations'
        forceMerge 'jackson.core'
        forceMerge 'jackson.databind'
        forceMerge 'sqlite.jdbc'
        forceMerge 'reactor.core'
        forceMerge 'reactive.streams'
        forceMerge 'jspecify'
        forceMerge 'mcp'
        forceMerge 'json.schema.validator'
        forceMerge 'jackson.dataformat.yaml'
        forceMerge 'snakeyaml'
        forceMerge 'itu'
    }
    
    jpackage {
        // jpackage accepts only dot-separated integers, so drop a suffix such as -SNAPSHOT
        appVersion = project.version.toString().replaceAll('-.*', '')
        if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
            installerOptions.addAll(['--win-dir-chooser', '--win-menu', '--win-shortcut'])
        } else if (org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            installerOptions.addAll(['--mac-package-name', 'MCP Client GUI'])
        }
    }
}

// Alternative: Use jpackage directly with the shadow JAR
tasks.register('jpackageFromShadow', Exec) {
    dependsOn shadowJar

    var buildPath = project.layout.buildDirectory.get().asFile.toString()

    def inputDir = file("${buildPath}/jpackage-input")
    def outputDir = file("${buildPath}/jpackage")

    doFirst {
        delete inputDir
        delete outputDir
        mkdir inputDir

        // Copy shadow JAR to input directory
        copy {
            from shadowJar.archiveFile
            into inputDir
        }
    }

    def appName = 'MCP Client GUI'
    def appVersion = 1

    commandLine = ['jpackage',
                   '--input', inputDir.absolutePath,
                   '--dest', outputDir.absolutePath,
                   '--name', appName,
                   '--app-version', appVersion,
                   '--main-jar', shadowJar.archiveFileName.get(),
                   '--main-class', 'com.brunorozendo.mcpclientgui.McpClientGuiLauncher',
                   '--java-options',
                   '--enable-native-access=javafx.web,javafx.graphics,org.xerial.sqlitejdbc',
                   '--java-options',
                   '--sun-misc-unsafe-memory-access=allow'
    ]

    if (currentOS.isWindows()) {
        commandLine += ['--type', 'msi', '--win-dir-chooser', '--win-menu', '--win-shortcut']
    } else if (currentOS.isMacOsX()) {
        commandLine += ['--type', 'dmg', '--mac-package-name', appName]
    } else if (currentOS.isLinux()) {
        commandLine += ['--type', 'deb']
    }

    doLast {
        println "Native installer created in: ${outputDir.absolutePath}"
    }
}

